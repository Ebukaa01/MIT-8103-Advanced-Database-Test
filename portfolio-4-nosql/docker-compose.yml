services:
  mongo:
    image: mongo:7
    container_name: equitypay-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: equitypay_user
      MONGO_INITDB_ROOT_PASSWORD: equitypay_pass
    volumes:
      - equitypay_mongo_data:/data/db

volumes:
  equitypay_mongo_data:

